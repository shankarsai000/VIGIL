[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "3.0.0"
description = "VIGIL Behavioral Immune System for AI Agent Pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "joblib>=1.3.0",
    "anthropic>=0.28.0",
    "redis>=5.0.7",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-telegram-bot>=21.0,<22",
    "armoriq-sdk==0.6.10",
    "mcp>=1.2.0,<2",
    "slack-sdk>=3.30.0",
    "slack-bolt>=1.20.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

