name: VIGIL CI

on:
  push:
    branches: [ "main", "submission-package" ]
  pull_request:
    branches: [ "main", "submission-package" ]

jobs:
  offline-tests:
    name: Backend Offline Tests & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Run Backend Offline Test Suite
        env:
          ARMORIQ_MODE: "local-demo"
        run: |
          pytest -m "not live" backend/tests/

      - name: Verify Evidence Vault Bundle (Offline Cryptography)
        run: |
          python verify_bundle.py evidence/vault/sample_bundle

      - name: Run Requirements Compliance Check
        run: |
          python scripts/check_requirements.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
